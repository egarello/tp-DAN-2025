name: Build and Push Docker Images

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Spring Boot JARs
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend Docker images
        run: |
          docker build -t "$IMAGE_PREFIX/user-svc:latest" ./services/user-svc
          docker build -t "$IMAGE_PREFIX/gestion-svc:latest" ./services/gestion-svc
          docker build -t "$IMAGE_PREFIX/reservas-svc:latest" ./services/reservas-svc
          docker build -t "$IMAGE_PREFIX/dan-spring-gateway:latest" ./common/dan-spring-gateway
          docker build -t "$IMAGE_PREFIX/rabbitmq:latest" ./infra/rabbitmq

      - name: Push Docker images to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE_PREFIX/user-svc:latest"
          docker push "$IMAGE_PREFIX/gestion-svc:latest"
          docker push "$IMAGE_PREFIX/reservas-svc:latest"
          docker push "$IMAGE_PREFIX/dan-spring-gateway:latest"
          docker push "$IMAGE_PREFIX/rabbitmq:latest"
