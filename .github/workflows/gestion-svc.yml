name: gestion-svc CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/gestion-svc/**'
      - '.github/workflows/gestion-svc.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/gestion-svc/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/gestion-svc

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('services/gestion-svc/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Correr tests
        working-directory: services/gestion-svc
        run: mvn clean test

  build-and-push:
    name: Build y Push imagen Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: services/gestion-svc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy a Railway
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deploy en Railway
        run: |
          curl -X POST "${{ secrets.RAILWAY_WEBHOOK_GESTION_SVC }}"